# Lima VM – Oracle Database 21c XE (x86_64 Ubuntu 22.04, Podman)
#
# Image: docker.io/gvenzl/oracle-xe:21-slim  (no Oracle registry account needed)
#
# Usage:
#   limactl start --name=oracle config/lima/oracle.yaml   # first time (~5-10 min)
#   limactl stop  oracle
#   limactl start oracle   # container restarts automatically via systemd
#   limactl delete oracle  # destroy VM and data completely
#
# Wait for Oracle to be ready (first boot takes 3-5 min):
#   until limactl shell oracle -- podman logs oracle-xe 2>/dev/null \
#         | grep -q "DATABASE IS READY TO USE"; do sleep 15; done
#
# Connection (from macOS host):
#   Python:  oracledb.connect(user="system", password="oracle", dsn="127.0.0.1:1521/XE")
#   sqlplus: sqlplus system/oracle@//127.0.0.1:1521/XE
#   JDBC:    jdbc:oracle:thin:@//127.0.0.1:1521/XE
#
# NOTE: Oracle XE is free for development use.
#   This config uses gvenzl/oracle-xe from Docker Hub — no login required.
#
# Why Lima + QEMU instead of Podman directly on macOS?
#   Oracle XE has no ARM64 image.  Running the x86_64 image via Rosetta 2
#   emulation under Podman/Docker Desktop is unreliable and will break when
#   Apple removes Rosetta 2 (~macOS 28, 2027).  Lima + QEMU emulates x86_64
#   independently of Rosetta 2 and remains stable long-term.
#
# Why Podman inside the VM instead of Docker?
#   Docker Engine requires a daemon running as root.  Podman is daemonless,
#   rootless-capable, and has no commercial licence requirement.

arch: "x86_64"

images:
  - location: "https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-amd64.img"

mounts:
  - location: "~"
  - location: "/tmp/lima"
    writable: true

containerd:
  system: false
  user: false

portForwards:
  - guestPort: 1521
    hostIP: "0.0.0.0"
  - guestPort: 5500
    hostIP: "127.0.0.1"

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -e
      apt-get update -y
      apt-get install -y podman netcat-openbsd

      # Allow the lima user to run Podman in rootless mode
      loginctl enable-linger lima 2>/dev/null || true

      # Pull and start Oracle XE using gvenzl/oracle-xe from Docker Hub.
      # No Oracle registry login required — publicly available image.
      # gvenzl/oracle-xe:21-slim is Oracle 21c Express Edition (~800 MB, vs
      # ~2.5 GB for the official Oracle registry image).
      # The --platform flag is explicit so Podman doesn't complain about arch mismatch.
      podman run -d \
        --name oracle-xe \
        --platform linux/amd64 \
        -p 1521:1521 \
        -p 5500:5500 \
        -e ORACLE_PASSWORD=oracle \
        docker.io/gvenzl/oracle-xe:21-slim

      # Enable auto-restart so oracle-xe survives limactl start/stop cycles
      podman generate systemd --new --name oracle-xe \
        > /etc/systemd/system/container-oracle-xe.service
      systemctl enable --now container-oracle-xe

probes:
  - script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 180s bash -c "until nc -z localhost 1521; do sleep 5; done"; then
        echo >&2 "Oracle XE is not listening yet"
        exit 1
      fi
    hint: |
      Oracle XE is still initialising (first boot takes 3-5 min).
      Run: limactl shell oracle -- podman logs oracle-xe
      Wait for: DATABASE IS READY TO USE!
