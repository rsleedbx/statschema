# Lima VM – Oracle Database 21c XE (x86_64 Ubuntu 22.04, Podman)
#
# Image: docker.io/gvenzl/oracle-xe:21-slim  (no Oracle registry account needed)
#
# Usage:
#   limactl start --name=oracle config/lima/oracle.yaml   # first time (~5-10 min)
#   limactl stop  oracle
#   limactl start oracle   # container restarts automatically via systemd
#   limactl delete oracle  # destroy VM and data completely
#
# Wait for Oracle to be ready (first boot takes 3-5 min):
#   until limactl shell oracle -- podman logs oracle-xe 2>/dev/null \
#         | grep -q "DATABASE IS READY TO USE"; do sleep 15; done
#
# Connection (from macOS host):
#   Python:  oracledb.connect(user="system", password="oracle", dsn="127.0.0.1:1521/XE")
#   sqlplus: sqlplus system/oracle@//127.0.0.1:1521/XE
#   JDBC:    jdbc:oracle:thin:@//127.0.0.1:1521/XE
#
# NOTE: Oracle XE is free for development use.
#   This config uses gvenzl/oracle-xe from Docker Hub — no login required.
#
# Why Lima + QEMU instead of Podman directly on macOS?
#   Oracle XE has no ARM64 image.  Running the x86_64 image via Rosetta 2
#   emulation under Podman/Docker Desktop is unreliable and will break when
#   Apple removes Rosetta 2 (~macOS 28, 2027).  Lima + QEMU emulates x86_64
#   independently of Rosetta 2 and remains stable long-term.
#
# Why Podman inside the VM instead of Docker?
#   Docker Engine requires a daemon running as root.  Podman is daemonless,
#   rootless-capable, and has no commercial licence requirement.

arch: "x86_64"

# ── VM resources ─────────────────────────────────────────────────────────────
# Oracle XE 21c container consumes ~3.1 GB at idle (SGA=1.5 GB + PGA=512 MB
# + background processes + page cache).  With 4 GB VM RAM and no swap:
#   available ≈ 1.2 GB  →  safe for 1 concurrent schema load  (schema_workers=1)
#
# Upgrade to 8 GB for 2 concurrent schema loads per engine:
#   memory: "8GiB"    # gives ~4.9 GB headroom; 2 loads × ~500 MB each = OK
#   Then set LIMA_VM_LARGE_RAM=1 to enable schema_workers=2 in run_matrix.py.
#
# NOTE: Oracle XE edition hard-caps SGA at 2 GB and max CPUs at 2 regardless
# of VM size.  More RAM helps PGA working memory and OS page cache, not SGA.
cpus: 4
memory: "8GiB"
disk: "100GiB"

images:
  - location: "https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-amd64.img"

mounts:
  - location: "~"
  - location: "/tmp/lima"
    writable: true

containerd:
  system: false
  user: false

portForwards:
  - guestPort: 1521
    hostIP: "0.0.0.0"
  - guestPort: 5500
    hostIP: "127.0.0.1"

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -e

      # Lima runs provision scripts on EVERY start.  Guard with a sentinel so
      # the image pull + container setup only happens once.
      # On subsequent starts, container-oracle-xe.service restarts automatically.
      if systemctl is-enabled container-oracle-xe 2>/dev/null | grep -q enabled; then
        exit 0
      fi

      apt-get update -y
      apt-get install -y podman netcat-openbsd

      # Allow the lima user to run Podman in rootless mode
      loginctl enable-linger lima 2>/dev/null || true

      # Trust the local registry running on the macOS host.
      # Reprovision pulls from here instead of docker.io (~800 MB saved).
      mkdir -p /etc/containers/registries.conf.d
      printf '[[ registry ]]\nlocation = "host.lima.internal:5000"\ninsecure = true\n' \
        > /etc/containers/registries.conf.d/local.conf

      # Pull from local registry (localhost:5000 on the macOS host).
      # If the image is missing, fail immediately — do NOT fall back to the internet.
      # Fix: run  bench_baseline.sh --mode=seed-registry --engine=oracle  on the host first.
      BASE_IMAGE="docker.io/gvenzl/oracle-xe:21-slim"
      LOCAL_IMAGE="host.lima.internal:5000/gvenzl/oracle-xe:21-slim"
      if ! podman pull --tls-verify=false "$LOCAL_IMAGE"; then
        echo >&2 "ERROR: $LOCAL_IMAGE not found in local registry."
        echo >&2 "On the macOS host run: bench_baseline.sh --mode=seed-registry --engine=oracle"
        exit 1
      fi
      podman tag "$LOCAL_IMAGE" "$BASE_IMAGE"

      # Named volume for Oracle data — persists across container/VM restarts.
      # gvenzl/oracle-xe detects existing data in /opt/oracle/oradata/XE and skips
      # re-initialization, so second start is fast.
      podman volume create oracle_data

      # --pull=never: image was just pulled from the local registry above;
      # prevents Docker Hub rate-limit hits on every systemd service restart.
      podman run -d \
        --name oracle-xe \
        --pull=never \
        -p 1521:1521 \
        -p 5500:5500 \
        -e ORACLE_PASSWORD=oracle \
        -v oracle_data:/opt/oracle/oradata \
        -v /tmp/lima:/tmp/lima \
        "$BASE_IMAGE"

      # Enable auto-restart so oracle-xe survives limactl start/stop cycles
      podman generate systemd --new --name oracle-xe > /etc/systemd/system/container-oracle-xe.service
      systemctl enable --now container-oracle-xe

probes:
  - script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 180s bash -c "until nc -z localhost 1521; do sleep 5; done"; then
        echo >&2 "Oracle XE is not listening yet"
        exit 1
      fi
    hint: |
      Oracle XE is still initialising (first boot takes 3-5 min).
      Run:  limactl shell oracle -- podman logs oracle-xe
      Wait for: DATABASE IS READY TO USE!
