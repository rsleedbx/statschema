# Lima VM – Microsoft SQL Server 2019 (x86_64 Ubuntu 20.04)
#
# Usage:
#   limactl start --name=sqlserver ~/github/statschema/config/lima/sqlserver.yaml
#   limactl stop  sqlserver
#   limactl start sqlserver
#   limactl delete sqlserver
#
# Connection (from macOS host):
#   sqlcmd -S 127.0.0.1,1433 -U sa -P 'Supersecure!'
#
# IMPORTANT: change MSSQL_SA_PASSWORD below before use.
# Password must be ≥ 8 chars with uppercase, lowercase, digit, and symbol.

arch: "x86_64"

# ── VM resources ─────────────────────────────────────────────────────────────
# SQL Server 2022 RSS at idle ≈ 2.7 GB; buffer pool grows to fill available RAM
# unless max server memory is capped.  WITHOUT a cap, SQL Server consumes
# 100% of the VM RAM, leaving 0 MB for concurrent schema loads → OOM kill.
#
# The provision script below sets max server memory to 3072 MB for a 4 GB VM,
# leaving ≈ 900 MB for OS + concurrent query sort/hash memory.
# With that cap: available ≈ 755 MB → 1 concurrent schema load is safe.
#
# Upgrade to 8 GB for 2 concurrent schema loads:
#   memory: "8GiB"   # leaves ~2 GB headroom with max_server_memory = 5632
#   Add to mssql.conf: [memory]  memorylimitmb = 5632
#   Then set LIMA_VM_LARGE_RAM=1 to enable schema_workers=2 in run_matrix.py.
cpus: 4
memory: "4GiB"
disk: "100GiB"

images:
  - location: "https://cloud-images.ubuntu.com/releases/20.04/release/ubuntu-20.04-server-cloudimg-amd64.img"

mounts:
  - location: "~"
  - location: "/tmp/lima"
    writable: true

containerd:
  system: false
  user: false

portForwards:
  - guestPort: 1433
    hostIP: "0.0.0.0"

provision:
  - mode: system
    script: |
      #!/bin/sh
      wget -qO- https://packages.microsoft.com/keys/microsoft.asc | apt-key add -
      add-apt-repository "$(wget -qO- https://packages.microsoft.com/config/ubuntu/20.04/mssql-server-2019.list)"
      apt-get update
      apt-get install -y mssql-server
      MSSQL_SA_PASSWORD='Supersecure!'
      MSSQL_PID=developer /opt/mssql/bin/mssql-conf -n setup accept-eula

      # Cap SQL Server buffer pool at 3072 MB for a 4 GB VM.
      # Without this, SQL Server consumes 100% of VM RAM (no swap → OOM on any
      # concurrent load).  3072 MB leaves ~900 MB for OS and concurrent query
      # working memory, supporting 1 safe parallel schema load at a time.
      # For 8 GB VMs, raise this to 5632 MB and enable schema_workers=2.
      /opt/mssql/bin/mssql-conf set memory.memorylimitmb 3072

probes:
  - script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 30s bash -c "until nc -z localhost 1433; do sleep 3; done"; then
        echo >&2 "sqlserver is not running yet"
        exit 1
      fi
    hint: |
      SQL Server is not up yet.
      Run "limactl shell sqlserver sudo tail /var/log/syslog" to check the log.
    message: |
      SQL Server is up and listening on port 1433.
