# Lima VM – Microsoft SQL Server 2022 (x86_64 Ubuntu 20.04)
#
# Usage:
#   limactl start --name=sqlserver22 config/lima/sqlserver22.yaml   # first time
#   limactl stop  sqlserver22
#   limactl start sqlserver22
#   limactl delete sqlserver22
#
# Connection (from macOS host):
#   sqlcmd -S 127.0.0.1,14330 -U sa -P "$(grep 'SQL Server sa password is' \
#       ~/.lima/sqlserver22/serial.log | tail -1 | awk '{print $NF}')"
#
# SA password: generated randomly by pwgen at first boot.
# Retrieve it:
#   grep 'SQL Server sa password is' ~/.lima/sqlserver22/serial.log | tail -1
#
# Port: 14330  (avoids conflict with sqlserver19 on 1433 if both VMs exist)

arch: "x86_64"

# ── VM resources ──────────────────────────────────────────────────────────────
# SQL Server 2022 at idle ≈ 2.7 GB RSS; buffer pool grows to fill all RAM
# unless capped.  Without a cap, SQL Server OOM-kills concurrent schema loads.
#
# 8 GiB VM + 5632 MB memory cap leaves ≈ 2.4 GB for OS + 2 concurrent
# identity-test schema loads (~500 MB peak each).
cpus: 4
memory: "8GiB"
disk: "100GiB"

images:
  - location: "https://cloud-images.ubuntu.com/releases/20.04/release/ubuntu-20.04-server-cloudimg-amd64.img"

mounts:
  - location: "~"
  - location: "/tmp/lima"
    writable: true

containerd:
  system: false
  user: false

portForwards:
  - guestPort: 14330

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail

      # Lima runs provision scripts on EVERY start.  Guard with a sentinel file
      # so the install + password-generation only happens once.
      SENTINEL=/var/opt/mssql/.statschema-provisioned
      if [[ -f "$SENTINEL" ]]; then
          # Already provisioned — just ensure the service is running.
          systemctl start mssql-server 2>/dev/null || true
          exit 0
      fi

      # ── Install SQL Server 2022 ────────────────────────────────────────────
      wget -qO- https://packages.microsoft.com/keys/microsoft.asc | apt-key add -
      add-apt-repository -y \
        "$(wget -qO- "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/mssql-server-2022.list")"
      apt-get update -y
      apt-get install -y pwgen mssql-server

      # ── Configure: port + memory cap + telemetry off ──────────────────────
      cat > /var/opt/mssql/mssql.conf <<EOF
      [network]
      tcpport = 14330

      [memory]
      memorylimitmb = 5632

      [telemetry]
      customerfeedback = false

      [EULA]
      accepteula = Y
      EOF

      # ── Generate SA password once and persist it ──────────────────────────
      PASS_FILE=/var/opt/mssql/.sa_password
      export MSSQL_SA_PASSWORD="$(pwgen -s 32 1)"
      echo "$MSSQL_SA_PASSWORD" > "$PASS_FILE"
      chmod 600 "$PASS_FILE"
      /opt/mssql/bin/mssql-conf set-sa-password
      systemctl start mssql-server

      # Log the password so bench_baseline.sh / _common.sh can retrieve it.
      echo "SQL Server sa password is ${MSSQL_SA_PASSWORD}"

      # ── Install sqlcmd (mssql-tools18) ────────────────────────────────────
      curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" \
        | tee /etc/apt/sources.list.d/mssql-release.list
      apt-get update -y
      ACCEPT_EULA=Y apt-get install -y mssql-tools18
      chmod a+rx /var/opt/mssql

      # ── Wait for SQL Server to be ready ───────────────────────────────────
      if ! timeout 60s bash -c "until nc -z localhost 14330; do sleep 3; done"; then
        echo >&2 "SQL Server did not come up on port 14330 after 60s"
        exit 1
      fi

      # ── Mark as provisioned (idempotency) ─────────────────────────────────
      touch "$SENTINEL"

probes:
  - script: |
      #!/bin/bash
      set -euo pipefail
      if ! timeout 30s bash -c "until nc -z localhost 14330; do sleep 3; done"; then
        echo >&2 "SQL Server is not up yet."
        exit 1
      fi
    hint: |
      SQL Server is still initialising.
      Check: limactl shell sqlserver22 -- sudo tail -20 /var/opt/mssql/log/errorlog
      Ready when you see: Recovery is complete.
