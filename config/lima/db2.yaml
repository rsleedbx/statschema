# Lima VM – IBM Db2 Community Edition (x86_64 Ubuntu 22.04, Podman)
#
# Image: icr.io/db2_community/db2  (replaces the deprecated ibmcom/db2 on Docker Hub)
# Note: No ARM64 image exists for Db2. Lima + QEMU emulates x86_64 stably.
#
# Usage:
#   limactl start --name=db2 config/lima/db2.yaml   # first boot takes 5-10 min
#   limactl stop  db2
#   limactl start db2                                # container restarts via systemd
#   limactl delete db2                               # destroy VM and all data
#
# Wait for Db2 to be ready (first boot, ~8 min):
#   until limactl shell db2 -- sudo podman logs db2ce 2>/dev/null \
#         | grep -q "Setup has completed"; do echo "waiting..."; sleep 15; done
#
# OWNERSHIP INVARIANT — DB2 startup (db2iupdt) requires:
#   db2inst1(1000):db2iadm1(1000) on /database/config/db2inst1
#   db2fenc1(1001):db2fadm1(1001) on /database/config/db2fenc1
#   root:db2iadm1(0:1000) on fencedid specifically
#
# With a named Podman volume, ownership changes persist across VM restarts
# (unlike a Lima host bind-mount which can revert).  A lightweight fix script
# at /usr/local/bin/db2ce-fixown.sh is still injected as ExecStartPre to guard
# against any edge cases.  Do NOT chown -R the whole volume — fencedid breaks.
#
# Connection (from macOS host):
#   Python (ibm_db_dbi):
#     import ibm_db_dbi
#     conn = ibm_db_dbi.connect(
#         "DATABASE=TESTDB;HOSTNAME=127.0.0.1;PORT=50000;PROTOCOL=TCPIP;UID=db2inst1;PWD=testpass;",
#         "", "")
#   db2 CLI (inside VM):
#     limactl shell db2 -- su - db2inst1 -c "db2 connect to testdb"

arch: "x86_64"

# icr.io/db2_community/db2 requires x86-64-v2 microarchitecture (SSE4.2, POPCNT).
# QEMU's default "qemu64" CPU model is baseline x86-64-v1 and triggers
# "Fatal glibc error: CPU does not support x86-64-v2".
cpuType:
  x86_64: "Haswell-noTSX-IBRS"

images:
  - location: "https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-amd64.img"

# ── VM resources ─────────────────────────────────────────────────────────────
# DB2's STMM (Self-Tuning Memory Manager) grows DATABASE_MEMORY automatically.
# At idle, db2sysc ≈ 2.2 GB RSS.  8 GiB leaves ≈ 4.5 GB for OS + concurrent loads.
memory: "8GiB"
cpus: 4
disk: "40GiB"

mounts:
  - location: "~"
  - location: "/tmp/lima"
    writable: true

containerd:
  system: false
  user: false

portForwards:
  - guestPort: 50000
    hostIP: "0.0.0.0"

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -e

      # Lima runs provision scripts on EVERY start.  Guard so the image pull +
      # container setup only runs once; systemd restarts the container thereafter.
      if systemctl is-enabled container-db2ce 2>/dev/null | grep -q enabled; then
        exit 0
      fi

      apt-get update -y
      apt-get install -y podman netcat-openbsd

      loginctl enable-linger lima 2>/dev/null || true

      # Trust the local registry running on the macOS host.
      # Reprovision pulls from here instead of icr.io (~3 GB saved).
      mkdir -p /etc/containers/registries.conf.d
      printf '[[ registry ]]\nlocation = "host.lima.internal:5000"\ninsecure = true\n' \
        > /etc/containers/registries.conf.d/local.conf

      # Named volume for DB2 data — Podman manages ownership and SELinux labels,
      # and changes persist across VM restarts (unlike a Lima host bind-mount).
      podman volume create db2_data

      # Pull from local registry (localhost:5000 on the macOS host).
      # If the image is missing, fail immediately — do NOT fall back to the internet.
      # Fix: run  bench_baseline.sh --mode=seed-registry --engine=db2  on the host first.
      BASE_IMAGE="icr.io/db2_community/db2:latest"
      LOCAL_IMAGE="host.lima.internal:5000/db2_community/db2:latest"
      if ! podman pull --tls-verify=false "$LOCAL_IMAGE"; then
        echo >&2 "ERROR: $LOCAL_IMAGE not found in local registry."
        echo >&2 "On the macOS host run: bench_baseline.sh --mode=seed-registry --engine=db2"
        exit 1
      fi
      podman tag "$LOCAL_IMAGE" "$BASE_IMAGE"

      # Pull and start IBM Db2 Community Edition.
      # --privileged required by DB2 for IPC shared memory and kernel capabilities.
      # /tmp/lima bind-mount gives DB2 the same staging path as the macOS host —
      # ADMIN_CMD LOAD reads files written by the Python loader at
      # /tmp/lima/statschema/ with no copy steps (see loader.py).
      podman run -d \
        --name db2ce \
        --privileged=true \
        -p 50000:50000 \
        -e LICENSE=accept \
        -e DB2INST1_PASSWORD=testpass \
        -e DBNAME=testdb \
        -e ARCHIVE_LOGS=false \
        -e AUTOCONFIG=false \
        -v db2_data:/database:Z \
        -v /tmp/lima:/tmp/lima \
        "$BASE_IMAGE"

      # ── Ownership fix script ──────────────────────────────────────────────
      # db2iupdt requires specific UIDs on config subdirs.  A host bind-mount
      # could revert ownership on VM restart; with a named volume it's stable,
      # but we keep the fix script as a guard.  It uses `podman volume inspect`
      # so the path is never hardcoded.
      cat > /usr/local/bin/db2ce-fixown.sh << 'FIXOWN'
      #!/bin/bash
      VOL=$(podman volume inspect db2_data --format "{{.Mountpoint}}" 2>/dev/null)
      if [[ -z "$VOL" ]]; then exit 0; fi
      if [[ ! -d "$VOL/config/db2inst1" ]]; then exit 0; fi
      chown -R 1000:1000 "$VOL/config/db2inst1" 2>/dev/null || true
      chown -R 1001:1001 "$VOL/config/db2fenc1" 2>/dev/null || true
      f="$VOL/config/db2inst1/sqllib/adm/fencedid"
      [[ -f "$f" ]] && chown 0:1000 "$f" || true
      FIXOWN
      chmod +x /usr/local/bin/db2ce-fixown.sh

      # Auto-restart on VM start/stop cycles.
      # --new: systemd recreates the container from the image on each start,
      # preserving named volume data while giving a clean process tree.
      podman generate systemd --new --name db2ce > /etc/systemd/system/container-db2ce.service

      # Inject the ownership fix before ExecStart
      sed -i '/^ExecStart=/i ExecStartPre=/usr/local/bin/db2ce-fixown.sh' /etc/systemd/system/container-db2ce.service

      systemctl daemon-reload
      systemctl enable --now container-db2ce

      # Cap DB2 STMM database memory at 2 GB (524288 × 4KB pages).
      # Wait for DB2 to finish first-boot setup (20-30 min under QEMU) before applying.
      timeout 2100 bash -c "
        until sudo podman exec db2ce su - db2inst1 -c 'db2 connect to testdb' >/dev/null 2>&1; do
          sleep 15
        done
        sudo podman exec db2ce su - db2inst1 -c \
          'db2 connect to testdb && db2 \"UPDATE DB CFG FOR testdb USING DATABASE_MEMORY 524288 IMMEDIATE\" && db2 connect reset'
      " || true

probes:
  - script: |
      #!/bin/bash
      set -eux -o pipefail
      # First boot under QEMU emulation takes 20-30 min; timeout set to 35 min.
      if ! timeout 2100s bash -c "
        until sudo podman logs db2ce 2>/dev/null | grep -q 'Setup has completed'; do
          sleep 15
        done
      "; then
        echo >&2 "Db2 CE did not finish setup within 35 minutes"
        exit 1
      fi
      sleep 15
      if ! nc -z localhost 50000; then
        echo >&2 "Db2 port 50000 not listening after setup"
        exit 1
      fi
    hint: |
      Db2 CE is still initialising (first boot takes 20-30 min under QEMU).
      Watch progress: limactl shell db2 -- sudo podman logs -f db2ce
      Wait for: "Setup has completed"
