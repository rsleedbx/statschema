[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statschema"
version = "0.1.1"
description = "Cross-dialect DDL transpiler, optimizer statistics bootstrapper, and synthetic data generator for database migrations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "rsleedbx" }
]
keywords = [
    "database",
    "migration",
    "ddl",
    "synthetic data",
    "statistics",
    "optimizer",
    "mysql",
    "postgresql",
    "oracle",
    "sql server",
    "databricks",
    "tpc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyYAML>=6.0",
    "sqlglot>=20.0.0",
    "python-dotenv>=1.0",
    "pandas>=2.0.0",
    "numpy>=1.20.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5.0",
    "pyarrow>=15.0.0",
    "delta-spark>=3.2.0",
    "dbldatagen>=0.4.0",
]
postgres  = ["psycopg2-binary>=2.9.0"]
mysql     = ["pymysql>=1.1.0"]
mssql     = ["pymssql>=2.2.0"]
oracle    = ["oracledb>=2.0.0"]
lakebase  = ["databricks-sdk>=0.89.0", "psycopg2-binary>=2.9.0"]
all = [
    "statschema[spark,postgres,mysql,mssql,oracle,lakebase]",
    "duckdb>=0.9.0",
    "sqlalchemy>=2.0.0",
]
dev = [
    "statschema[all]",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage    = "https://github.com/rsleedbx/statschema"
Repository  = "https://github.com/rsleedbx/statschema"
Issues      = "https://github.com/rsleedbx/statschema/issues"
Changelog   = "https://github.com/rsleedbx/statschema/releases"

[project.scripts]
statschema = "statschema.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/statschema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-q"
markers = [
    "live:   marks tests that require a live database (deselect with -m 'not live')",
    "slow:   marks tests that take >30 s (deselect with -m 'not slow')",
    "obj1:   Objective 1 — Schema correctness",
    "obj2:   Objective 2 — Source type coverage",
    "obj3:   Objective 3 — Row count correctness",
    "obj4:   Objective 4 — Distribution fidelity",
    "obj5:   Objective 5 — Stats injection fidelity",
    "obj6:   Objective 6 — Semantic correctness",
    "obj7:   Objective 7 — Plan fidelity (identity test)",
    "obj8:   Objective 8 — Cross-engine portability",
    "obj9:   Objective 9 — Benchmark compatibility",
    "obj10:  Objective 10 — Step-level testability",
]

[tool.coverage.run]
source = ["src/statschema"]
omit   = ["src/statschema/__main__.py"]
