    load_after: [DimCompany]
    fk_constraints:
      - columns: [SK_CompanyID]
        parent_table: DimCompany
        parent_columns: [SK_CompanyID]
        name: fk_dimsecurity_company
        fk_distribution: uniform
    columns:
      - name: SK_SecurityID
        type: bigint
        not_null: true
        primary_key: true
        generation:
          distribution: sequential
          min_value: 1
          unique: true
      - name: Symbol
        type: string
        length: 15
        not_null: true
      - name: Issue
        type: string
        length: 6
        not_null: true
        generation:
          values: ["COMMON", "PREF_A", "PREF_B"]
          weights: [0.80, 0.12, 0.08]
      - name: Status
        type: string
        length: 10
        not_null: true
        generation:
          values: ["Active", "Inactive"]
          weights: [0.93, 0.07]
      - name: Name
        type: string
        length: 70
        not_null: true
      - name: ExchangeID
        type: string
        length: 6
        not_null: true
        generation:
          values: ["NYSE", "NASDAQ", "AMEX", "LSE", "TSX"]
          weights: [0.35, 0.30, 0.10, 0.15, 0.10]
      - name: SK_CompanyID
        type: bigint
        not_null: true
      - name: SharesOutstanding
        type: bigint
        not_null: true
        generation:
          min_value: 1000000
          max_value: 10000000000
          distribution: uniform
      - name: FirstTrade
        type: date
        not_null: true
        generation:
          min_value: "1990-01-01"
          max_value: "2009-12-31"
      - name: FirstTradeOnExchange
        type: date
        not_null: true
        generation:
          min_value: "1990-01-01"
          max_value: "2009-12-31"
      - name: Dividend
        type: decimal
        precision: 10
        scale: 2
        not_null: true
        generation:
          min_value: 0.00
          max_value: 10.00
          distribution: uniform
      - name: IsCurrent
        type: boolean
        not_null: true
        generation:
          values: [true, false]
          weights: [0.93, 0.07]
      - name: BatchID
        type: smallint
        not_null: true
        generation:
          values: [1, 2, 3]
          weights: [0.6, 0.3, 0.1]
      - name: EffectiveDate
        type: date
        not_null: true
        generation:
          min_value: "2010-01-01"
          max_value: "2018-12-31"
      - name: EndDate
        type: date
        not_null: true
        generation:
