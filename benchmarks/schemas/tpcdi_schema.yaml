        length: 100
        not_null: true
      - name: AddressLine1
        type: string
        length: 80
        not_null: true
      - name: AddressLine2
        type: string
        length: 80
      - name: PostalCode
        type: string
        length: 12
        not_null: true
      - name: City
        type: string
        length: 25
        not_null: true
      - name: StateProv
        type: string
        length: 20
        not_null: true
      - name: Country
        type: string
        length: 24
        not_null: true
        generation:
          values: ["USA", "GBR", "CAN", "DEU", "FRA", "JPN", "AUS", "CHN", "IND", "BRA"]
          weights: [0.40, 0.12, 0.10, 0.08, 0.08, 0.07, 0.05, 0.04, 0.03, 0.03]
      - name: Description
        type: string
        length: 150
        not_null: true
      - name: FoundingDate
        type: date
        description: "Company founding date; nullable for missing data"
        generation:
          min_value: "1900-01-01"
          max_value: "2009-12-31"
      - name: IsCurrent
        type: boolean
        not_null: true
        generation:
          values: [true, false]
          weights: [0.90, 0.10]
      - name: BatchID
        type: smallint
        not_null: true
        generation:
          values: [1, 2, 3]
          weights: [0.6, 0.3, 0.1]
      - name: EffectiveDate
        type: date
        not_null: true
        generation:
          min_value: "2010-01-01"
          max_value: "2018-12-31"
      - name: EndDate
        type: date
        not_null: true
        generation:
          min_value: "2019-01-01"
          max_value: "9999-12-31"

  # ── DimBroker ─────────────────────────────────────────────────────────────────
  # ~100 per SF. SCD Type 2.
  - name: DimBroker
    description: "TPC-DI broker dimension (SCD2) — ~100 rows per SF"
