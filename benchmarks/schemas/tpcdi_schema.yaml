          unique: true
      - name: SK_BrokerID
        type: bigint
        not_null: true
      - name: SK_CreateDateID
        type: bigint
        not_null: true
      - name: SK_CreateTimeID
        type: bigint
        not_null: true
      - name: SK_CloseDateID
        type: bigint
        description: "NULL for open / pending trades"
      - name: SK_CloseTimeID
        type: bigint
        description: "NULL for open / pending trades"
      - name: Status
        type: string
        length: 10
        not_null: true
        generation:
          values: ["CMPL", "ACTV", "CNCL", "PNDG", "SBMT"]
          weights: [0.85, 0.05, 0.05, 0.03, 0.02]
      - name: Type
        type: string
        length: 12
        not_null: true
