        length: 4
        description: "S&P credit rating; NULL for unrated companies"
        generation:
          values: ["AAA", "AA+", "AA", "AA-", "A+", "A", "A-", "BBB+", "BBB", "BBB-",
                   "BB+", "BB", "B", "CCC", "D", null]
          weights: [0.02, 0.03, 0.05, 0.05, 0.07, 0.10, 0.10, 0.09, 0.09, 0.09,
                    0.08, 0.06, 0.05, 0.04, 0.02, 0.06]
      - name: IsLowGrade
        type: boolean
        not_null: true
        generation:
          values: [false, true]
          weights: [0.80, 0.20]
      - name: CEO
