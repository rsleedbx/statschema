      - name: IsCurrent
        type: boolean
        not_null: true
        generation:
          values: [true, false]
          weights: [0.90, 0.10]
      - name: BatchID
        type: smallint
        not_null: true
        generation:
          values: [1, 2, 3]
          weights: [0.6, 0.3, 0.1]
      - name: EffectiveDate
        type: date
        not_null: true
        generation:
          min_value: "2010-01-01"
          max_value: "2018-12-31"
      - name: EndDate
        type: date
        not_null: true
        generation:
          min_value: "2019-01-01"
          max_value: "9999-12-31"

  # ── DimSecurity ───────────────────────────────────────────────────────────────
