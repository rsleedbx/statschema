        length: 10
        not_null: true
        generation:
          values: ["Active", "Inactive"]
          weights: [0.92, 0.08]
      - name: Name
        type: string
        length: 60
        not_null: true
      - name: Industry
        type: string
        length: 50
        not_null: true
      - name: SPrating
