      type: varchar
      length: 4
      not_null: true
      primary_key: true
      generation:
        values: ["ACTV", "CMPT", "CNCL", "PNDG", "SBMT"]
    - name: st_name
      type: varchar
      length: 10
      generation:
        values: ["Active", "Completed", "Canceled", "Pending", "Submitted"]

- name: trade_type
  description: "Trade type codes — 5 fixed rows."
  row_count: 5
  columns:
    - name: tt_id
      type: varchar
      length: 3
      not_null: true
      primary_key: true
      generation:
        values: ["TLB", "TLS", "TMB", "TMS", "TSL"]
    - name: tt_name
      type: varchar
      length: 12
      generation:
        values:
          - "Limit-Buy"
          - "Limit-Sell"
          - "Market-Buy"
          - "Market-Sell"
          - "Stop-Loss"
    - name: tt_is_sell
      type: integer
      generation: {values: [0, 1, 0, 1, 1]}
    - name: tt_is_mrkt
      type: integer
      generation: {values: [0, 0, 1, 1, 1]}

