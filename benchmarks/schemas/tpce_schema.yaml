# TPC-E canonical schema  (TPC-E v1.14 approximation)
#
# TPC-E models a brokerage workload.  The minimum scale is 1,000 customers
# (EF=1).  Row counts below target EF=500 (500,000 customers) — the TPC-E
# minimum for a published result — but the schema scales via row_count_per_ef
# expressed through row_count_per_sf (sf = EF here).
#
# Reference: https://www.tpc.org/tpce/
#
# Table taxonomy
# ──────────────
# Reference tables (static content, small)
#   EXCHANGE, SECTOR, STATUS_TYPE, TRADE_TYPE, TAXRATE, CHARGE,
#   COMMISSION_RATE — defined with fixed values lists or builtin_generator.
# Scaling customer tables
#   CUSTOMER, ADDRESS, CUSTOMER_ACCOUNT, CUSTOMER_TAXRATE,
#   ACCOUNT_PERMISSION, WATCH_LIST, WATCH_ITEM
# Scaling market tables
#   BROKER, COMPANY, COMPANY_COMPETITOR, INDUSTRY, SECURITY,
#   FINANCIAL, NEWS_ITEM, NEWS_XREF, DAILY_MARKET, LAST_TRADE
# Scaling transaction tables
#   TRADE, TRADE_HISTORY, TRADE_REQUEST, HOLDING, HOLDING_HISTORY,
#   HOLDING_SUMMARY, CASH_TRANSACTION
# ZIP reference
#   ZIP_CODE — builtin_generator for 14,741 US ZIP-code rows

tables:

# ── Reference tables ────────────────────────────────────────────────────────

- name: exchange
  description: "Stock exchanges — 4 fixed rows."
  row_count: 4
  columns:
    - name: ex_id
      type: varchar
      length: 6
      not_null: true
      primary_key: true
      generation:
        values: ["NYSE", "NASDAQ", "AMEX", "CBT"]
    - name: ex_name
      type: varchar
      length: 100
      generation:
        values:
          - "New York Stock Exchange"
          - "National Association of Securities Dealers Automated Quotations"
          - "American Stock Exchange"
          - "Chicago Board of Trade"
    - name: ex_num_symb
      type: integer
      generation:
        values: [3000, 4000, 1000, 500]
    - name: ex_open
      type: integer
      generation: {values: [900, 930, 930, 840]}
    - name: ex_close
      type: integer
      generation: {values: [1600, 1600, 1600, 1515]}
    - name: ex_desc
      type: varchar
      length: 150
    - name: ex_ad_id
      type: varchar
      length: 80

