- name: charge
  description: "Brokerage fee schedule — 1 row per trade-type × tier."
  row_count: 15
  columns:
    - name: ch_tt_id
      type: varchar
      length: 3
      not_null: true
      primary_key: true
      generation:
        values: ["TLB", "TLS", "TMB", "TMS", "TSL"]
    - name: ch_c_tier
      type: integer
      not_null: true
      primary_key: true
      generation: {min_value: 1, max_value: 3}
    - name: ch_chrg
      type: decimal
      precision: 10
      scale: 2
      generation: {min_value: 1.00, max_value: 30.00}

- name: commission_rate
  description: "Broker commission rate schedule — 1 row per type × tier × qty range."
  row_count: 240
  columns:
    - name: cr_c_tier
      type: integer
      not_null: true
      primary_key: true
      generation: {min_value: 1, max_value: 4}
    - name: cr_tt_id
      type: varchar
      length: 3
      not_null: true
      primary_key: true
      generation:
        values: ["TLB", "TLS", "TMB", "TMS", "TSL"]
    - name: cr_ex_id
      type: varchar
      length: 6
      not_null: true
      primary_key: true
      generation:
        values: ["NYSE", "NASDAQ", "AMEX", "CBT"]
    - name: cr_from_qty
      type: integer
      not_null: true
      primary_key: true
      generation: {min_value: 1, max_value: 500}
    - name: cr_to_qty
      type: integer
      not_null: true
      generation: {min_value: 501, max_value: 10000}
    - name: cr_rate
      type: decimal
      precision: 5
      scale: 2
      generation: {min_value: 0.01, max_value: 0.50}

- name: zip_code
  description: "US ZIP code reference — 14,741 synthetic entries."
  builtin_generator: zip_code
  row_count: 14741
  columns:
    - {name: zc_code,     type: varchar, length: 12, not_null: true, primary_key: true}
    - {name: zc_town,     type: varchar, length: 80, not_null: true}
    - {name: zc_div,      type: varchar, length: 80, not_null: true}
    - {name: zc_country,  type: varchar, length: 80}
    - {name: zc_is_metro, type: integer}

# ── Customer & account tables ────────────────────────────────────────────────

- name: address
  description: "Mailing addresses — 1.33 addresses per customer (2 per account owner on average)."
  row_count_per_sf: 1333333
  columns:
    - name: ad_id
      type: varchar
      length: 80
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1, format_pattern: upper_id, length: 20}
    - name: ad_line1
      type: varchar
      length: 80
      generation: {format_pattern: word}
    - name: ad_line2
      type: varchar
      length: 80
    - name: ad_zc_code
      type: varchar
      length: 12
      generation: {min_value: 1, max_value: 14741, format_pattern: zero_padded_int, length: 5}
    - name: ad_ctry
      type: varchar
      length: 80
      generation: {values: ["United States"]}

- name: customer
  description: "Brokerage customers — 1,000,000 per EF (expressed as SF)."
  row_count_per_sf: 1000000
  columns:
    - name: c_id
      type: long
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1}
    - name: c_tax_id
      type: varchar
      length: 20
      not_null: true
      generation: {format_pattern: upper_id, length: 12}
    - name: c_st_id
      type: varchar
      length: 4
      not_null: true
      generation: {values: ["ACTV"]}
    - name: c_l_name
      type: varchar
      length: 25
      not_null: true
      generation: {format_pattern: last_name}
    - name: c_f_name
      type: varchar
      length: 20
      not_null: true
      generation: {format_pattern: first_name}
    - name: c_m_name
      type: char
      length: 1
      generation: {format_pattern: upper_alpha, length: 1}
    - name: c_gndr
      type: char
      length: 1
      generation: {values: ["M", "F"]}
    - name: c_tier
      type: integer
      generation: {min_value: 1, max_value: 3}
    - name: c_dob
      type: date
      generation: {min_value: "1924-01-01", max_value: "1999-12-31"}
    - name: c_ad_id
      type: varchar
      length: 80
      not_null: true
    - name: c_ctry_1
      type: varchar
      length: 3
      generation: {values: ["001"]}
    - name: c_area_1
      type: varchar
      length: 3
      generation: {min_value: 200, max_value: 999}
    - name: c_local_1
      type: varchar
      length: 7
      generation: {format_pattern: upper_id, length: 7}
    - name: c_ctry_2
      type: varchar
      length: 3
    - name: c_area_2
      type: varchar
      length: 3
    - name: c_local_2
      type: varchar
      length: 7
    - name: c_ctry_3
      type: varchar
      length: 3
    - name: c_area_3
      type: varchar
      length: 3
    - name: c_local_3
      type: varchar
      length: 7
    - name: c_ext
      type: varchar
      length: 5
    - name: c_email_1
      type: varchar
      length: 50
      generation: {format_pattern: email}
    - name: c_email_2
      type: varchar
      length: 50
  fk_constraints:
    - columns: [c_st_id]
      parent_table: status_type
      parent_columns: [st_id]
    - columns: [c_ad_id]
      parent_table: address
      parent_columns: [ad_id]

- name: customer_taxrate
  description: "Customer→tax-rate mapping (2–4 tax rates per customer)."
  row_count_per_sf: 3000000
  load_after: [customer, taxrate]
  columns:
    - name: cx_tx_id
      type: varchar
      length: 4
      not_null: true
      primary_key: true
    - name: cx_c_id
      type: long
      not_null: true
      primary_key: true
    - name: cx_rate
      type: decimal
      precision: 6
      scale: 5
      generation: {min_value: 0.00, max_value: 0.15}
  fk_constraints:
    - columns: [cx_c_id]
      parent_table: customer
      parent_columns: [c_id]
    - columns: [cx_tx_id]
      parent_table: taxrate
      parent_columns: [tx_id]

- name: broker
  description: "Broker accounts — 1 broker per 1,000 customers."
  row_count_per_sf: 1000
  columns:
    - name: b_id
      type: long
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1}
    - name: b_st_id
      type: varchar
      length: 4
      not_null: true
      generation: {values: ["ACTV"]}
    - name: b_name
      type: varchar
      length: 49
      not_null: true
      generation: {format_pattern: full_name}
    - name: b_num_trades
      type: integer
      generation: {min_value: 0, max_value: 100000}
    - name: b_comm_total
      type: decimal
      precision: 12
      scale: 2
      generation: {min_value: 0.00, max_value: 1000000.00}
    - name: b_ad_id
      type: varchar
      length: 80
      not_null: true
  fk_constraints:
    - columns: [b_st_id]
      parent_table: status_type
      parent_columns: [st_id]

- name: customer_account
  description: "Brokerage accounts — 5 accounts per customer on average."
  row_count_per_sf: 5000000
  load_after: [customer, broker]
  columns:
    - name: ca_id
      type: long
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1}
    - name: ca_b_id
      type: long
      not_null: true
    - name: ca_c_id
      type: long
      not_null: true
    - name: ca_name
      type: varchar
      length: 50
      generation: {format_pattern: word}
    - name: ca_tax_st
      type: integer
      not_null: true
      generation: {min_value: 0, max_value: 2}
    - name: ca_bal
      type: decimal
      precision: 12
      scale: 2
      generation: {min_value: -1000000.00, max_value: 10000000.00}
  fk_constraints:
    - columns: [ca_b_id]
      parent_table: broker
      parent_columns: [b_id]
    - columns: [ca_c_id]
      parent_table: customer
      parent_columns: [c_id]

- name: account_permission
  description: "Additional users permitted on an account — ~1.5 extra per account."
  row_count_per_sf: 7500000
  load_after: [customer_account]
  columns:
    - name: ap_ca_id
      type: long
      not_null: true
      primary_key: true
    - name: ap_acl
      type: varchar
      length: 4
      not_null: true
      primary_key: true
      generation: {values: ["0000", "0001", "0011", "0111", "1111"]}
    - name: ap_tax_id
      type: varchar
      length: 20
      not_null: true
      generation: {format_pattern: upper_id, length: 12}
    - name: ap_l_name
      type: varchar
      length: 25
      not_null: true
      generation: {format_pattern: last_name}
    - name: ap_f_name
      type: varchar
      length: 20
      not_null: true
      generation: {format_pattern: first_name}
  fk_constraints:
    - columns: [ap_ca_id]
      parent_table: customer_account
      parent_columns: [ca_id]

- name: watch_list
  description: "Customer watch lists — 1 per customer."
  row_count_per_sf: 1000000
  load_after: [customer]
  columns:
    - name: wl_id
      type: long
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1}
    - name: wl_c_id
      type: long
      not_null: true
    - name: wl_created_date
      type: date
      generation: {min_value: "2000-01-01", max_value: "2005-01-01"}
  fk_constraints:
    - columns: [wl_c_id]
      parent_table: customer
      parent_columns: [c_id]

- name: watch_item
  description: "Securities on customer watch lists — 10–20 securities per list."
  row_count_per_sf: 15000000
  load_after: [watch_list]
  columns:
    - name: wi_wl_id
      type: long
      not_null: true
      primary_key: true
    - name: wi_s_symb
      type: varchar
      length: 15
      not_null: true
      primary_key: true
      generation: {format_pattern: upper_id, length: 7}
    - name: wi_creation_date
      type: date
      generation: {min_value: "2000-01-01", max_value: "2005-01-01"}
  fk_constraints:
    - columns: [wi_wl_id]
      parent_table: watch_list
      parent_columns: [wl_id]
    - columns: [wi_s_symb]
      parent_table: security
      parent_columns: [s_symb]

# ── Market / securities tables ───────────────────────────────────────────────

- name: company
  description: "Listed companies — 5,000 per SF."
  row_count_per_sf: 5000
  load_after: [exchange, industry, status_type]
  columns:
    - name: co_id
      type: long
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1}
    - name: co_st_id
      type: varchar
      length: 4
      not_null: true
      generation: {values: ["ACTV"]}
    - name: co_name
      type: varchar
      length: 60
      not_null: true
      generation: {format_pattern: word}
    - name: co_in_id
      type: varchar
      length: 2
      not_null: true
      generation: {min_value: 1, max_value: 102, format_pattern: zero_padded_int, length: 2}
    - name: co_sp_rate
      type: varchar
      length: 4
      generation:
        values: ["AAA", "AA+", "AA", "AA-", "A+", "A", "A-", "BBB", "BB", "B", "C", "D"]
    - name: co_ceo
      type: varchar
      length: 46
      generation: {format_pattern: full_name}
    - name: co_ad_id
      type: varchar
      length: 80
      not_null: true
    - name: co_desc
      type: varchar
      length: 150
      generation: {format_pattern: sentence}
    - name: co_open_date
      type: date
      generation: {min_value: "1960-01-01", max_value: "2004-01-01"}
  fk_constraints:
    - columns: [co_st_id]
      parent_table: status_type
      parent_columns: [st_id]
    - columns: [co_in_id]
      parent_table: industry
      parent_columns: [in_id]
    - columns: [co_ad_id]
      parent_table: address
      parent_columns: [ad_id]

- name: company_competitor
  description: "Competitor pairs — 3 competitors per company."
  row_count_per_sf: 15000
  load_after: [company, industry]
  columns:
    - name: cp_co_id
      type: long
      not_null: true
      primary_key: true
    - name: cp_comp_co_id
      type: long
      not_null: true
      primary_key: true
    - name: cp_in_id
      type: varchar
      length: 2
      not_null: true
      primary_key: true
      generation: {min_value: 1, max_value: 102, format_pattern: zero_padded_int, length: 2}
  fk_constraints:
    - columns: [cp_co_id]
      parent_table: company
      parent_columns: [co_id]
    - columns: [cp_comp_co_id]
      parent_table: company
      parent_columns: [co_id]
    - columns: [cp_in_id]
      parent_table: industry
      parent_columns: [in_id]

- name: security
  description: "Listed securities — ~6,850 per SF (1–2 per company)."
  row_count_per_sf: 6850
  load_after: [company, exchange, status_type]
  columns:
    - name: s_symb
      type: varchar
      length: 15
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1}
    - name: s_issue
      type: varchar
      length: 6
      not_null: true
      generation: {values: ["COMMON", "PREF_A", "PREF_B"]}
    - name: s_st_id
      type: varchar
      length: 4
      not_null: true
      generation: {values: ["ACTV"]}
    - name: s_name
      type: varchar
      length: 70
      not_null: true
      generation: {format_pattern: word}
    - name: s_ex_id
      type: varchar
      length: 6
      not_null: true
      generation: {values: ["NYSE", "NASDAQ", "AMEX"]}
    - name: s_co_id
      type: long
      not_null: true
    - name: s_num_out
      type: long
      not_null: true
      generation: {min_value: 1000000, max_value: 10000000000}
    - name: s_start_date
      type: date
      generation: {min_value: "1960-01-01", max_value: "2001-01-01"}
    - name: s_exch_date
      type: date
      generation: {min_value: "1960-01-01", max_value: "2001-01-01"}
    - name: s_pe
      type: decimal
      precision: 10
      scale: 2
      generation: {min_value: 1.00, max_value: 200.00}
    - name: s_52wk_high
      type: decimal
