# TPC-DS canonical schema  (TPC-DS v3 approximation)
#
# Row counts at SF=1 follow the TPC-DS specification §4.1.
# Tables whose content is fully determined by the spec use
# builtin_generator instead of random column synthesis.
#
# Fixed tables (do not scale with SF):
#   date_dim              73,049   (1900-01-02 → 2100-01-01)
#   time_dim              86,400   (one row per second of the day)
#   customer_demographics 1,920,800 (Cartesian product of 8 demographic attributes)
#   household_demographics 7,200   (product of income_band × buy_potential × dep/veh)
#   income_band           20
#   reason                55
#   ship_mode             20
#
# Scaling tables use row_count_per_sf; integer SF is assumed.
# Reference: https://www.tpc.org/tpc_documents_current_versions/pdf/tpc-ds_v3.2.0.pdf

tables:

# ── Fixed dimension tables ──────────────────────────────────────────────────

- name: date_dim
  description: "Calendar day dimension — one row per day from 1900-01-02 to 2100-01-01."
  builtin_generator: date_dim
  row_count: 73049
  columns:
    - {name: d_date_sk,           type: integer,  not_null: true, primary_key: true}
    - {name: d_date_id,           type: varchar,  length: 16, not_null: true, unique: true}
    - {name: d_date,              type: date}
    - {name: d_month_seq,         type: integer}
    - {name: d_week_seq,          type: integer}
    - {name: d_quarter_seq,       type: integer}
    - {name: d_year,              type: integer}
    - {name: d_dow,               type: integer}
    - {name: d_moy,               type: integer}
    - {name: d_dom,               type: integer}
    - {name: d_qoy,               type: integer}
    - {name: d_fy_year,           type: integer}
    - {name: d_fy_quarter_seq,    type: integer}
    - {name: d_fy_week_seq,       type: integer}
    - {name: d_day_name,          type: varchar,  length: 9}
    - {name: d_quarter_name,      type: varchar,  length: 6}
    - {name: d_holiday,           type: char,     length: 1}
    - {name: d_weekend,           type: char,     length: 1}
    - {name: d_following_holiday, type: char,     length: 1}
    - {name: d_first_dom,         type: integer}
    - {name: d_last_dom,          type: integer}
    - {name: d_same_day_ly,       type: integer}
    - {name: d_same_day_lq,       type: integer}
    - {name: d_current_day,       type: char,     length: 1}
    - {name: d_current_week,      type: char,     length: 1}
    - {name: d_current_month,     type: char,     length: 1}
    - {name: d_current_quarter,   type: char,     length: 1}
    - {name: d_current_year,      type: char,     length: 1}

- name: time_dim
  description: "Time-of-day dimension — one row per second (86,400 rows)."
  builtin_generator: time_dim
  row_count: 86400
  columns:
    - {name: t_time_sk,   type: integer, not_null: true, primary_key: true}
    - {name: t_time_id,   type: varchar, length: 16, not_null: true, unique: true}
    - {name: t_time,      type: integer}
    - {name: t_hour,      type: integer}
    - {name: t_minute,    type: integer}
    - {name: t_second,    type: integer}
    - {name: t_am_pm,     type: char,    length: 2}
    - {name: t_shift,     type: varchar, length: 20}
    - {name: t_sub_shift, type: varchar, length: 20}
    - {name: t_meal_time, type: varchar, length: 20}

- name: customer_demographics
  description: "Full Cartesian product of 8 demographic attributes — 1,920,800 rows."
  builtin_generator: customer_demographics
  row_count: 1920800
  columns:
    - {name: cd_demo_sk,            type: integer, not_null: true, primary_key: true}
    - {name: cd_gender,             type: char,    length: 1}
    - {name: cd_marital_status,     type: char,    length: 1}
    - {name: cd_education_status,   type: varchar, length: 20}
    - {name: cd_purchase_estimate,  type: integer}
    - {name: cd_credit_rating,      type: varchar, length: 10}
    - {name: cd_dep_count,          type: integer}
    - {name: cd_dep_employed_count, type: integer}
    - {name: cd_dep_college_count,  type: integer}

- name: household_demographics
  description: "Product of income_band × buy_potential × dep_count × vehicle_count — 7,200 rows."
  builtin_generator: household_demographics
  row_count: 7200
  columns:
    - {name: hd_demo_sk,         type: integer, not_null: true, primary_key: true}
    - {name: hd_income_band_sk,  type: integer}
    - {name: hd_buy_potential,   type: varchar, length: 15}
    - {name: hd_dep_count,       type: integer}
    - {name: hd_vehicle_count,   type: integer}
  fk_constraints:
    - columns: [hd_income_band_sk]
      parent_table: income_band
      parent_columns: [ib_income_band_sk]

- name: income_band
  description: "20 income bracket definitions, each spanning $10,000."
  builtin_generator: income_band
  row_count: 20
  columns:
    - {name: ib_income_band_sk, type: integer, not_null: true, primary_key: true}
    - {name: ib_lower_bound,    type: integer}
    - {name: ib_upper_bound,    type: integer}

- name: reason
  description: "Return-reason lookup — 55 fixed rows."
  row_count: 55
  columns:
    - name: r_reason_sk
      type: integer
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1}
    - name: r_reason_id
      type: varchar
      length: 16
      not_null: true
      generation: {format_pattern: upper_id, length: 16}
    - name: r_reason_desc
      type: varchar
      length: 100
      generation:
        values:
          - "Did not fit"
          - "Not as described"
          - "Better price available"
          - "No longer needed"
          - "Damaged"
          - "Wrong item shipped"
          - "Defective"
          - "Changed mind"
          - "Gift duplicate"
          - "Price discrepancy"
          - "Missing parts"
          - "Item arrived late"
          - "Ordered by mistake"
          - "Expired"
          - "Poor quality"

- name: ship_mode
  description: "Shipping method lookup — 20 fixed rows."
  row_count: 20
  columns:
    - name: sm_ship_mode_sk
      type: integer
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1}
    - name: sm_ship_mode_id
      type: varchar
      length: 16
      not_null: true
      generation: {format_pattern: upper_id, length: 16}
    - name: sm_type
      type: varchar
      length: 30
      generation:
        values:
          - "LIBRARY"
          - "TWO DAY"
          - "NEXT DAY AIR"
          - "SURFACE"
          - "OVERNIGHT"
          - "EXPRESS"
          - "GROUND"
          - "PRIORITY"
    - name: sm_code
      type: varchar
      length: 10
      generation:
        values:
          - "EXPRESS"
          - "PRIORITY"
          - "ECONOMY"
          - "STANDARD"
    - name: sm_carrier
      type: varchar
      length: 20
      generation:
        values:
          - "Universal"
          - "Airborne"
          - "Zouros"
          - "Tribune"
          - "Diamond"
          - "Overnight"
          - "USPS"
          - "DHL"
          - "FedEx"
          - "UPS"
    - name: sm_contract
      type: varchar
      length: 20
      generation: {format_pattern: upper_id, length: 16}

# ── Scaling dimension tables ────────────────────────────────────────────────

